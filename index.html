<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Maloba Immobilien</title><style>html,body{margin:0;background:#fff}.boot{min-height:100vh;display:grid;place-items:center;font:16px Arial;color:#555}.boot:after{content:"";width:34px;height:34px;border:3px solid #ddd;border-top-color:#9da628;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="boot" aria-label="Website wird geladen"></div><script>(async()=>{try{const n=6,p=await Promise.all(Array.from({length:n},(_,i)=>fetch(`page/page-${i}.txt?v=20260802`).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));document.open();document.write(p.join(''));document.close()}catch(e){document.body.innerHTML='<main style="max-width:760px;margin:80px auto;padding:24px;font:18px Arial"><h1>Die Seite konnte nicht geladen werden.</h1><p>Bitte laden Sie die Seite erneut.</p></main>';console.error(e)}})()</script></body></html>
