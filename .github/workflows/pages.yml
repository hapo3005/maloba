name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build approved high-resolution hero
        run: |
          cat assets/hero-final-{00..04}.txt | tr -d '\r\n\t ' | base64 --decode > assets/hero-master.webp
          test -s assets/hero-master.webp
          file assets/hero-master.webp

      - name: Add deployment marker
        run: printf '%s' "$GITHUB_SHA" > build-version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
